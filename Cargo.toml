[package]
name = "coding-agent"
version = "0.1.0"
authors = ["Gérôme Meyer <gerome.meyer@pm.me>"]
edition = "2024"
rust-version = "1.93"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }  # async runtime
async-openai = { version = "=0.32.4", features = ["byot", "chat-completion"] }
clap = { version = "4.3.14", features = ["derive"] }                 # CLI argument parsing
serde_json = "1.0.149"                                                # JSON serialization/deserialization
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
ratatui = "0.30.0"
color-eyre = "0.6.5"
octocrab = "0.49.5"
tokio-stream = "0.1.18"

[dependencies.crossterm]
version = "0.29.0"
features = ["event-stream"]